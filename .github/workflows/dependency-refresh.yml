name: Resolve compatible security updates

on:
  push:
    branches: [codex/fu-hobbies-validation]
    paths: [.github/workflows/dependency-refresh.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: fu
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix deps.get --check-locked
      - name: Resolve compatible versions and retain the candidate lock
        run: |
          mix deps.update bandit phoenix phoenix_live_view plug hpax mint decimal lazy_html postgrex
          printf 'FU_CANDIDATE_LOCK_BEGIN\n'
          cat mix.lock
          printf 'FU_CANDIDATE_LOCK_END\n'
      - uses: actions/upload-artifact@v4
        with:
          name: fu-compatible-security-lock
          path: fu/mix.lock
          retention-days: 7
      - run: mix hex.audit
