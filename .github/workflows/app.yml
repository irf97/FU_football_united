name: Spontaan application validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: fu
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix deps.get --check-locked
      - name: Audit locked dependencies
        run: mix hex.audit
      - name: Collector contract tests
        run: python3 -m unittest qa/equipment_collector_test.py qa/ble_scanner_test.py
      - name: Required compile, formatting and full application checks
        run: mix precommit
      - name: Build browser assets
        run: |
          sh scripts/fetch-tailwind.sh
          mix assets.deploy

  local-mobile:
    name: Local mobile app
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fu
    env:
      FU_LOCAL_BROWSER_QA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix qa
      - run: npx --prefix qa playwright install --with-deps chromium
      - name: Run the actual PowerShell launcher
        shell: pwsh
        run: ./local-mobile.ps1 -HostIP 127.0.0.1 -Port 4030 -NoOpen
      - name: Exercise local sign-in and persistent desktop/mobile sessions
        working-directory: fu/qa
        run: npx playwright test --config local-mobile.config.cjs
      - name: Keep local mobile evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spontaan-local-mobile-${{ github.run_id }}
          path: |
            fu/qa/local-mobile-results/
            fu/qa/results/local-mobile-browser.json
          retention-days: 7
      - name: Stop the disposable local CI workspace
        if: always()
        run: docker compose --project-name spontaan-local-mobile --env-file .env.local-mobile -f compose.local-mobile.yml down --volumes

  pilot-release:
    name: Production-image simulation
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fu
    env:
      FU_BROWSER_QA: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fu_pilot_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fu/qa/package-lock.json
      - name: Install locked browser QA dependencies
        run: npm ci --prefix qa
      - name: Install Chromium
        run: npx --prefix qa playwright install --with-deps chromium
      - name: Build, migrate and rehearse the production release
        run: qa/release.sh
      - name: Keep measured rehearsal evidence and browser captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fu-pilot-browser-${{ github.run_id }}
          path: |
            fu/qa/test-results/
            fu/qa/results/
          retention-days: 7
