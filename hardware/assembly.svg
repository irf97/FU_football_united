<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Spontaan R1 receiver and T1 item carrier designs</title>
<desc id="desc">Dimensioned layouts of a 95 by 60 millimetre receiver carrier for a 65 by 30 millimetre Raspberry Pi Zero 2 W, and a 58 by 50 millimetre strap-mounted carrier for a sealed 30 by 9 millimetre BLE beacon.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#786d62"/></marker></defs>
<rect width="1120" height="760" rx="24" fill="#f7f2ea"/>
<g font-family="Arial, sans-serif" fill="#29251f">
<text x="44" y="48" font-size="15" letter-spacing="3" fill="#965132">SPONTAAN / HARDWARE</text>
<text x="44" y="91" font-size="30" font-weight="700">One receiver zone. Equipment that connects.</text>
<text x="44" y="120" font-size="15" fill="#655e53">R1/T1 reference assembly · all dimensions in mm · editable CAD accompanies this drawing</text>
<rect x="34" y="151" width="534" height="384" rx="16" fill="#fffdf9" stroke="#dfd5c8"/>
<rect x="586" y="151" width="500" height="384" rx="16" fill="#fffdf9" stroke="#dfd5c8"/>
<text x="58" y="186" font-size="19" font-weight="700">R1 · receiver board assembly</text>
<g transform="translate(85 225) scale(4)">
  <rect width="95" height="60" rx="4" fill="#e3e9de" stroke="#667d65" stroke-width=".5"/>
  <g fill="#fffdf9" stroke="#82917c" stroke-width=".4"><rect x="4" y="4.25" width="8" height="3.5" rx="1.75"/><rect x="83" y="4.25" width="8" height="3.5" rx="1.75"/><rect x="4" y="52.25" width="8" height="3.5" rx="1.75"/><rect x="83" y="52.25" width="8" height="3.5" rx="1.75"/></g>
  <rect x="15" y="15" width="65" height="30" rx="2" fill="#477557" stroke="#24492e" stroke-width=".6"/>
  <g fill="#e3e9de" stroke="#24492e" stroke-width=".4"><circle cx="18.5" cy="18.5" r="1.4"/><circle cx="76.5" cy="18.5" r="1.4"/><circle cx="18.5" cy="41.5" r="1.4"/><circle cx="76.5" cy="41.5" r="1.4"/></g>
  <rect x="38" y="23" width="13" height="13" fill="#254131"/>
  <path d="M20 16.5H74" stroke="#cfcc84" stroke-width="1.7" stroke-dasharray="1.3 1.3"/>
  <text x="47" y="40" text-anchor="middle" font-size="2.5" fill="#f7f2ea">Pi Zero 2 W · 65 × 30</text>
</g>
<path d="M85 212H465" stroke="#786d62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="275" y="207" text-anchor="middle" font-size="13">95</text>
<path d="M72 225V465" stroke="#786d62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="59" y="350" text-anchor="middle" font-size="13">60</text>
<text x="87" y="493" font-size="13">58 × 23 board-hole centres · M2.5 clearance</text>
<text x="87" y="514" font-size="13" fill="#655e53">3 mm base + 6 mm stands · USB and antenna stay clear</text>
<text x="610" y="186" font-size="19" font-weight="700">T1 · strap-mounted item carrier</text>
<g transform="translate(690 225) scale(4)">
  <rect width="58" height="50" rx="4" fill="#e8dcee" stroke="#80688e" stroke-width=".5"/>
  <g fill="#fffdf9" stroke="#80688e" stroke-width=".5"><rect x="3.5" y="14.5" width="3" height="21" rx=".5"/><rect x="51.5" y="14.5" width="3" height="21" rx=".5"/></g>
  <g fill="#c9b5d3" stroke="#80688e" stroke-width=".5"><circle cx="29" cy="5" r="3"/><circle cx="29" cy="45" r="3"/><circle cx="29" cy="25" r="17.6"/></g>
  <circle cx="29" cy="25" r="15.6" fill="#f6f0f8" stroke="#80688e" stroke-width=".5"/>
  <circle cx="29" cy="25" r="15" fill="none" stroke="#b19bbd" stroke-width=".4" stroke-dasharray="1.2 1.2"/>
  <g fill="#fffdf9"><circle cx="29" cy="5" r="1.25"/><circle cx="29" cy="45" r="1.25"/></g>
  <text x="29" y="23.5" text-anchor="middle" font-size="3" fill="#65516d">sealed tag</text>
  <text x="29" y="28" text-anchor="middle" font-size="3" fill="#65516d">Ø30 × 9</text>
</g>
<path d="M690 212H922" stroke="#786d62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="806" y="207" text-anchor="middle" font-size="13">58</text>
<path d="M678 225V425" stroke="#786d62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="663" y="330" text-anchor="middle" font-size="13">50</text>
<text x="676" y="463" font-size="13">20 mm strap · 31.2 mm internal diameter</text>
<text x="676" y="485" font-size="13">12.6 mm body + separate 2 mm lid · two M2 screws</text>
<text x="676" y="507" font-size="13" fill="#655e53">Adapt to the chosen tag; fasten to its bag or case.</text>
<rect x="34" y="555" width="1052" height="167" rx="16" fill="#ebe4d9"/>
<text x="58" y="588" font-size="19" font-weight="700">Connections and identity</text>
<text x="58" y="620" font-size="15">Power: regulated 5 V / 2.5 A → board PWR IN. GPIO is unused.</text>
<text x="58" y="649" font-size="15">Radio: sealed tag → BLE receiver. UUID + major + minor → the item's inventory ID.</text>
<text x="58" y="678" font-size="15">Delivery: private queue → HTTPS observations API. The app assigns the receiver's fixed zone.</text>
<text x="58" y="704" font-size="13" fill="#655e53">Use the manual for assembly, service setup and engineer review. No custom RF PCB or bare battery is required.</text>
</g></svg>
